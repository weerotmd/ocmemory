<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>OC Memory Game</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/mina');
    @import url('https://fonts.cdnfonts.com/css/bolonewt');

    :root {
      --black: #000000;
      --white: #ffffff;

      --pastel-blue: #58b5e0;

      --background: #383838;
      
      --primary-dark: #161616;
      --primary-shadow: #202020;
      --primary: #2d2d2d;
      --primary-highlight: #3d3d3d;
      --primary-bright: #505050;
      
      --primary-dark-04: #16161666;
      --primary-04: #2d2d2d66;
      --primary-bright-04: #50505066;
      
      --secondary-dark: #226731;
      --secondary-shadow: #2e8533;
      --secondary: #369c2e;
      --secondary-highlight: #3caa2d;
      --secondary-bright: #42b42f;

      --secondary-cold-dark: #236b48;
      --secondary-cold-shadow: #308d5c;
      --secondary-cold: #349959;

      --secondary-hot: #3b9027;

      --shaded-glass: #2d2d2d99;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    * {
      font-family: 'Mina', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /*--Custom elements--*/
    a {
        color: var(--pastel-blue);
        text-decoration: none;
    }

    /*--Buttons--*/
    button {
      display: block;
      margin: auto;
      font-size: 1.5rem;
      padding: 0.5rem 2rem;
      background: var(--primary);
      color: var(--secondary);
      border: 0.2rem solid var(--secondary);
      border-radius: 3rem;
      transition: all 0.1s;
      cursor: pointer;
    }
    button:hover {
      color: var(--primary);
      background: var(--secondary-bright);
      border: 0.2rem solid var(--secondary-bright);
      box-shadow: 0 0 1rem var(--secondary-hot);
    }

    /*--Boxes--*/
    .modernNeonBoxGlass {
      background: var(--primary-04);
      border: 0.2rem solid var(--secondary-shadow);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px var(--secondary-cold-dark);
      border-radius: 3rem;
      font-weight: 1;
    }
    .background-blur {
      z-index: 2;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--primary-bright-04);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px var(--secondary-cold-dark);
      font-weight: 1;
    }

    /*--Input--*/
    textarea {
      font-size: 1.2rem;
      width: 100%;
      height: 30vh;
      color: var(--secondary-highlight);
      background: var(--primary);
      border: 0.2rem solid var(--secondary);
      border-radius: 3rem;
      caret-color: var(--secondary-bright);
      outline: none;
      padding: 1rem;
    }
    textarea::placeholder {
      color: var(--secondary-cold-shadow);
    }

    body {
      max-width: 100vw;
      max-height: 100vh;
      background: var(--background);
      color: var(--white);
      align-items: center;
      padding: 0;
      margin: 0;
      font-weight: 1;
      display: flex;
      flex-direction: column;
    }
    header {
      color: var(--secondary);
      background: var(--primary);
      border: 0.2rem solid var(--secondary-shadow);
      box-shadow: 0 0 10px var(--secondary-cold-dark);
      border-radius: 15px;
      width: clamp(15rem, 98vw, 200rem);
      font-weight: 1;
      margin: auto;
      padding: 1rem 0;
    }
    header > h1 {
      font-family: 'Bolonewt', sans-serif;
      text-transform: uppercase;
      background: linear-gradient(to bottom, var(--secondary-bright), var(--secondary-cold-dark));
      background-clip: text;
      color: transparent;
      margin: 0;
      font-weight: 1;
      letter-spacing: 2px;
      text-align: center;
    }
    header > h2 {
      margin: 0;
      font-weight: 1;
      text-align: center;
    }

    main {
      width: 100vw;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    section.infos {
      width: clamp(15rem, 98vw, 200rem);
      margin: auto;
      display: flex;
      flex-direction: column;
    }
    section.infos h2 {
      width: fit-content;
      font-size: 2rem;
      padding: 0.5rem 1rem;
      margin-bottom: 1rem;
      background: var(--primary-04);
      border: 0.2rem solid var(--secondary-shadow);
      border-radius: 3rem;
    }

    section.infos article {
      padding: 0.5rem;
      font-size: 1.1rem;
    }
    section.infos article p {
      text-align: center;
      margin-bottom: 0.8rem;
    }
    section.infos article strong {
      font-weight: 600;
      font-size: 1.2rem;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background-color: var(--primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-bright);
      border: none;
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ouverture Culturelle</h1>
    <h2>Jeu de mémorisation</h2>
  </header>
  <main>
    <section class="infos">
      <h2></h2>
      <article class="modernNeonBoxGlass"></article>
    </section>
  </main>

  <script>
    const exercices = {
      1: [
        "chat", "avion", "pizza", "lune", "clé", "éléphant", "guitare",
        "glace", "volcan", "livre", "ballon", "montagne", "ordinateur",
        "parapluie", "tigre", "bateau", "horloge", "fromage", "casque",
        "miroir", "fusée", "banane", "lampe", "vélo", "dragon"
      ],

      2: [
        "pirate", "château", "rivière", "robot", "étoile", "chaussure",
        "serpent", "piano", "forêt", "café", "licorne", "télévision",
        "valise", "requin", "bougie", "île", "téléphone", "nuage",
        "camion", "gâteau", "épée", "soleil", "carte", "porte", "panda"
      ],

      3: [
        "avec", "pause", "eau", "cognac", "fou", "illusion",
        "officiel", "terrasse", "aller", "parade", "lunettes",
        "pharmacie", "test", "public"
      ]
    };

    function nettoyer(texte) {
      return texte
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // enlève accents
        .replace(/[^a-zA-Z0-9\s,]/g, "")
        .split(/[\s,]+/)
        .filter(m => m.length > 0);
    }

    function afficherTest(numeroExo) {
      const sectionTitle = document.querySelector("section.infos h2");
      const article = document.querySelector("section.infos article");

      sectionTitle.textContent = `Exercice ${numeroExo}`;

      article.innerHTML = `
        <p>Écris tous les mots dont tu te souviens :</p>
        <textarea id="input" placeholder="Tape les mots séparés par des espaces ou des virgules..."></textarea>
        <br><br>
        <button onclick="corriger(${numeroExo})">Valider</button>
        <div class="result" id="resultat"></div>
        <p><a href="?">⬅ Retour au menu</a></p>
      `;
    }

    function corriger(numeroExo) {
      const motsOriginaux = exercices[numeroExo];
      
      // Nettoie la liste de mots à retenir (supprime accents, minuscule)
      const mots = motsOriginaux.map(m => m.toLowerCase()
                                          .normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
      
      const input = document.getElementById("input").value;
      const reponses = nettoyer(input);
      const uniques = [...new Set(reponses)];

      let bons = [];
      let faux = [];

      uniques.forEach(mot => {
        if (mots.includes(mot)) {
          bons.push(mot);
        } else {
          faux.push(mot);
        }
      });

      // Pour afficher les mots manqués, on prend les mots originaux
      const manques = motsOriginaux.filter(m => {
        const motNettoye = m.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        return !bons.includes(motNettoye);
      });

      document.getElementById("resultat").innerHTML = `
        <p><strong>Ne pas raffraichir la page!</strong></p>
        <p><strong>Score: ${bons.length} / ${mots.length}</strong></p>
        <p>Mots trouvés: ${bons.join(", ") || "aucun"}</p>
        `;
        //<p>Mots manqués: ${manques.join(", ")}</p>
    }

    function init() {
      const sectionTitle = document.querySelector("section.infos h2");
      const article = document.querySelector("section.infos article");

      const urlParams = new URLSearchParams(window.location.search);
      const exo = urlParams.get('exo');

      if (exo && exercices[exo]) {
        afficherTest(exo);
      } else {
        sectionTitle.textContent = "Menu";

        article.innerHTML = `
          <p><strong>Choisis un exercice:</strong></p>
          <p><a href="?exo=1">Exercice 1</a></p>
          <p><a href="?exo=2">Exercice 2</a></p>
          <p><a href="?exo=3">Exercice 3</a></p>
        `;
      }
    }

    init();
  </script>
</body>
</html>
